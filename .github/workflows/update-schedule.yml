name: Update GTFS Schedule
on:
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch: {}

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm ci
      - run: npm run generate-schedule
      - uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: 'chore: update GTFS schedule data'
          file_pattern: src/generated/schedule-data.json
